[project]
name = "dmp"
version = "0.1.0"
description = "Aplicacao offline-first para gestao de uma papelaria."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.48,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
follow_imports = "skip"
python_version = "3.11"
strict = true
mypy_path = "src"
exclude = ['(^|/)(build|dist|\.venv)/']

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
